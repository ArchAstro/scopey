name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, real prompts, agent transcripts, or raw `~/.scopey/` files. Use synthetic and redacted examples.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scopey version or commit
      placeholder: scopey 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - Grok
        - Pi
        - OpenCode
        - Multiple / unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, and redacted `scopey doctor` details.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private prompts, transcripts, and personal data.
          required: true
