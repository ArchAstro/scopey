name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: scopey-darwin-arm64
          - runner: macos-15-intel
            asset: scopey-darwin-x64
          - runner: ubuntu-24.04-arm
            asset: scopey-linux-arm64
          - runner: ubuntu-24.04
            asset: scopey-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build archive
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/package
          cp target/release/scopey dist/package/scopey
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.asset }}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: dist
          pattern: scopey-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scopey-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/scopey-*.tar.gz dist/checksums.txt
          --verify-tag
          --generate-notes
          --title "Scopey ${GITHUB_REF_NAME}"
