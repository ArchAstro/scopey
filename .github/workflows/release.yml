name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version, changelog, and tag
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "manual releases must run from main" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no ${version} release section" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "${GITHUB_SHA}" ]]; then
              echo "tag ${tag} already points to ${tag_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: scopey-darwin-arm64
          - runner: macos-15-intel
            asset: scopey-darwin-x64
          - runner: ubuntu-24.04-arm
            asset: scopey-linux-arm64
          - runner: ubuntu-24.04
            asset: scopey-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "${{ needs.prepare.outputs.version }}"
      - name: Build archive
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/package
          cp target/release/scopey dist/package/scopey
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.asset }}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: dist
          pattern: scopey-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scopey-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] &&
             ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${RELEASE_COMMIT}"
          fi
          gh release create "${RELEASE_TAG}" \
            dist/scopey-*.tar.gz dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "Scopey ${RELEASE_TAG}"
