name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  pull_request:
    types: [closed]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Prepare release bump PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ARCHASTRO_RELEASE_GITHUB_TOKEN }}
      - name: Apply selected version bump
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          version="$(scripts/prepare-release.sh "$RELEASE_BUMP")"
          tag="v${version}"
          branch="release/${tag}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "release branch ${branch} already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Validate bumped checkout
        run: |
          cargo check --locked
          git diff --check
      - name: Open and auto-merge release PR
        env:
          GH_TOKEN: ${{ secrets.ARCHASTRO_RELEASE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        shell: bash
        run: |
          git switch -c "$RELEASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release v${RELEASE_VERSION}"
          git push --set-upstream origin "$RELEASE_BRANCH"

          pr_url="$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v${RELEASE_VERSION}" \
            --body "Automated release bump for v${RELEASE_VERSION}. Merge this PR to build and publish the release.")"
          gh pr merge "$pr_url" --auto --rebase

  prepare:
    name: Validate merged release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Validate version, changelog, and tag
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"\]*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          commit="$(git rev-parse HEAD)"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no ${version} release section" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "tag ${tag} already points to ${tag_commit}, not ${commit}" >&2
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: scopey-darwin-arm64
          - runner: macos-15-intel
            asset: scopey-darwin-x64
          - runner: ubuntu-24.04-arm
            asset: scopey-linux-arm64
          - runner: ubuntu-24.04
            asset: scopey-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"\]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "${{ needs.prepare.outputs.version }}"
      - name: Build archive
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/package
          cp target/release/scopey dist/package/scopey
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.asset }}.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: dist
          pattern: scopey-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scopey-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] &&
             ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${RELEASE_COMMIT}"
          fi
          gh release create "${RELEASE_TAG}" \
            dist/scopey-*.tar.gz dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "Scopey ${RELEASE_TAG}"

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: dist
          pattern: scopey-*
          merge-multiple: true
      - name: Update Scopey formula
        env:
          GH_TOKEN: ${{ secrets.ARCHASTRO_RELEASE_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "ARCHASTRO_RELEASE_GITHUB_TOKEN is not configured" >&2
            exit 1
          fi

          darwin_arm64_sha="$(sha256sum dist/scopey-darwin-arm64.tar.gz | cut -d ' ' -f 1)"
          darwin_x64_sha="$(sha256sum dist/scopey-darwin-x64.tar.gz | cut -d ' ' -f 1)"
          linux_arm64_sha="$(sha256sum dist/scopey-linux-arm64.tar.gz | cut -d ' ' -f 1)"
          linux_x64_sha="$(sha256sum dist/scopey-linux-x64.tar.gz | cut -d ' ' -f 1)"

          gh auth setup-git
          git clone https://github.com/ArchAstro/homebrew-tools.git "$RUNNER_TEMP/homebrew-tools"
          cd "$RUNNER_TEMP/homebrew-tools"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ./scripts/update-scopey-formula.sh \
            "$RELEASE_VERSION" \
            "$darwin_arm64_sha" \
            "$darwin_x64_sha" \
            "$linux_arm64_sha" \
            "$linux_x64_sha"

          if [[ -z "$(git status --porcelain -- Formula/scopey.rb)" ]]; then
            echo "Homebrew formula is already current"
            exit 0
          fi

          git add Formula/scopey.rb
          git commit -m "scopey v${RELEASE_VERSION}"
          git push origin main
